<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Finder</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --line: #e3e6eb; --text: #1d2330; --muted: #6b7280;
    --accent: #2563eb; --ok: #15803d; --warn: #b45309; --bad: #b91c1c; --sel: #eef3ff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12151b; --panel: #1a1e26; --line: #2a303b; --text: #e6e8ec; --muted: #9aa3b2;
            --accent: #60a5fa; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --sel: #1f2a3d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; gap: 12px; align-items: center; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 12px 0 0; }
  header .stats { color: var(--muted); margin-left: auto; }
  input, select, textarea { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  main { display: grid; grid-template-columns: minmax(280px, 420px) 1fr; height: calc(100vh - 57px); }
  #list { overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); }
  .item { padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:hover { background: var(--sel); }
  .item.active { background: var(--sel); box-shadow: inset 3px 0 0 var(--accent); }
  .item .firma { font-weight: 600; }
  .item .meta { color: var(--muted); font-size: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 10px; border: 1px solid currentColor; }
  .b-ok { color: var(--ok); } .b-zweifelhaft { color: var(--warn); } .b-falsch { color: var(--bad); }
  .b-status { color: var(--muted); }
  #detail { overflow-y: auto; padding: 24px 32px; }
  #detail h2 { margin: 0 0 4px; font-size: 20px; }
  .sub { color: var(--muted); margin-bottom: 16px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
  .btn { display: inline-block; padding: 7px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); text-decoration: none; cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
  .card h3 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .desc { white-space: pre-wrap; }
  .crm { display: grid; grid-template-columns: 140px 1fr; gap: 8px 12px; align-items: center; }
  .crm textarea { min-height: 70px; resize: vertical; }
  .saved { color: var(--ok); font-size: 12px; margin-left: 8px; }
  .empty { color: var(--muted); padding: 40px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; height: auto; } #list { max-height: 45vh; } #detail { padding: 16px; } }
</style>
</head>
<body>
<header>
  <h1>Lead Finder · Handwerk</h1>
  <input id="q" type="search" placeholder="Firma, Ort, Gewerk …">
  <select id="fStatus">
    <option value="">Alle Status</option><option value="neu">neu</option><option value="angerufen">angerufen</option>
    <option value="interessiert">interessiert</option><option value="kein_interesse">kein Interesse</option>
  </select>
  <select id="fCheck">
    <option value="">Alle Prüfungen</option><option value="ok">Sonnet: ok</option>
    <option value="zweifelhaft">Sonnet: zweifelhaft</option><option value="falsch">Sonnet: falsch</option>
  </select>
  <span class="stats" id="stats"></span>
</header>
<main>
  <div id="list"></div>
  <section id="detail"><div class="empty">Lead links auswählen.</div></section>
</main>
<script>
let leads = [], current = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function load() {
  leads = await (await fetch("/api/leads")).json();
  renderList();
}

function visible() {
  const q = $("q").value.toLowerCase(), st = $("fStatus").value, ck = $("fCheck").value;
  return leads.filter((l) =>
    (!q || `${l.firma} ${l.ort} ${l.gewerk} ${l.titel}`.toLowerCase().includes(q)) &&
    (!st || (l.status || "neu") === st) && (!ck || l.check_urteil === ck));
}

function checkBadge(l) {
  return l.check_urteil ? `<span class="badge b-${esc(l.check_urteil)}">Sonnet: ${esc(l.check_urteil)}</span>` : "";
}

function renderList() {
  const items = visible();
  $("stats").textContent = `${items.length} von ${leads.length} Leads`;
  $("list").innerHTML = items.map((l) => `
    <div class="item ${current === l.refnr ? "active" : ""}" data-ref="${esc(l.refnr)}">
      <div class="firma">${esc(l.firma)}</div>
      <div>${esc(l.titel)}</div>
      <div class="meta"><span>${esc(l.plz)} ${esc(l.ort)}</span><span>${esc(l.gewerk)}</span>
        <span>${esc(l.veroeffentlicht)}</span><span class="badge b-status">${esc(l.status || "neu")}</span>${checkBadge(l)}</div>
    </div>`).join("") || `<div class="empty">Keine Treffer.</div>`;
  document.querySelectorAll(".item").forEach((el) => el.onclick = () => show(el.dataset.ref));
}

function show(refnr) {
  current = refnr;
  const l = leads.find((x) => x.refnr === refnr);
  const phoneSearch = "https://www.google.com/search?q=" + encodeURIComponent(`${l.firma} ${l.ort} Telefon`);
  $("detail").innerHTML = `
    <h2>${esc(l.firma)}</h2>
    <div class="sub">${esc(l.titel)} · ${esc(l.plz)} ${esc(l.ort)} · veröffentlicht ${esc(l.veroeffentlicht)}</div>
    <div class="actions">
      ${l.telefon ? `<a class="btn primary" href="tel:${esc(l.telefon)}">📞 ${esc(l.telefon)}</a>` : ""}
      <a class="btn" href="${esc(phoneSearch)}" target="_blank" rel="noopener">Telefonnummer suchen</a>
      <a class="btn" href="${esc(l.link)}" target="_blank" rel="noopener">Anzeige bei der BA</a>
      ${l.externe_url ? `<a class="btn" href="${esc(l.externe_url)}" target="_blank" rel="noopener">Externe Anzeige</a>` : ""}
    </div>
    <div class="card"><h3>CRM</h3><div class="crm">
      <label>Telefon</label><input id="eTel" value="${esc(l.telefon)}" placeholder="nach Recherche eintragen">
      <label>Status</label><select id="eStatus">${["neu","angerufen","interessiert","kein_interesse"]
        .map((s) => `<option ${ (l.status||"neu") === s ? "selected" : ""}>${s}</option>`).join("")}</select>
      <label>Notiz</label><textarea id="eNotiz">${esc(l.notiz)}</textarea>
      <span></span><div><button class="btn primary" id="save">Speichern</button><span class="saved" id="saved"></span></div>
    </div></div>
    <div class="card"><h3>Gewerk & Büroaufgaben (Haiku)</h3>
      <div><b>${esc(l.gewerk || "–")}</b></div>
      <ul>${l.aufgaben.map((a) => `<li>${esc(a)}</li>`).join("")}</ul>
      <div class="sub">${esc(l.begruendung)}</div></div>
    <div class="card"><h3>Gegencheck (Sonnet)</h3>
      ${l.check_urteil ? `${checkBadge(l)} ${l.check_online === 0 ? '<span class="badge b-falsch">nicht mehr online</span>' : l.check_online === 1 ? '<span class="badge b-ok">online</span>' : ""}
        <p>${esc(l.check_notiz)}</p>` : `<span class="sub">Noch nicht geprüft.</span>`}</div>
    <div class="card"><h3>Stellenbeschreibung</h3><div class="desc">${esc(l.beschreibung || "–")}</div></div>`;
  $("save").onclick = () => save(l);
  renderList();
}

async function save(l) {
  const changes = { telefon: $("eTel").value.trim(), status: $("eStatus").value, notiz: $("eNotiz").value };
  await fetch(`/api/leads/${encodeURIComponent(l.refnr)}`, { method: "POST", body: JSON.stringify(changes) });
  Object.assign(l, changes);
  $("saved").textContent = "gespeichert";
  renderList();
}

["q", "fStatus", "fCheck"].forEach((id) => $(id).addEventListener("input", renderList));
load();
</script>
</body>
</html>
