<svg xmlns="http://www.w3.org/2000/svg" width="780" height="784" viewBox="0 0 780 784">
<rect width="100%" height="100%" rx="18" fill="#181c23"/>
<rect width="7" height="100%" rx="3" fill="#fab387"/>
<text x="36" y="44" fill="#fab387" font-family="sans-serif" font-size="29" font-weight="700" xml:space="preserve">Projektordner ermitteln</text>
<text x="36" y="80" fill="#a7b4c5" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">Echter Code aus main.py</text>
<text x="36" y="140" fill="#89dceb" font-family="monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve">PROJECT_DIR = Path(__file__).resolve().parent</tspan></text>
<text x="36" y="200" fill="#ffffff" font-family="sans-serif" font-size="21" font-weight="700" xml:space="preserve">Rechts auswerten → Ergebnis links an Namen binden.</text>
<text x="36" y="260" fill="#d9e1ec" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">PROJECT_DIR → variable name (Variablenname)</text>
<text x="36" y="296" fill="#a7b4c5" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">Großschreibung kennzeichnet eine Konstante.</text>
<text x="36" y="332" fill="#d9e1ec" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">= → assignment (Zuweisung)</text>
<text x="36" y="392" fill="#d9e1ec" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">Path → class (Klasse)</text>
<text x="36" y="428" fill="#d9e1ec" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">__file__ → Variable mit dem Pfad dieser Datei</text>
<text x="36" y="464" fill="#d9e1ec" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">Path(__file__) → erzeugt ein Pfadobjekt</text>
<text x="36" y="524" fill="#d9e1ec" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">.resolve() → attribute access + method call</text>
<text x="36" y="560" fill="#a7b4c5" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">Liefert einen absoluten, aufgelösten Pfad.</text>
<text x="36" y="596" fill="#d9e1ec" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">.parent → attribute access auf eine Property</text>
<text x="36" y="632" fill="#a7b4c5" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">Liefert den übergeordneten Ordner.</text>
<text x="36" y="692" fill="#d9e1ec" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">Gesamte rechte Seite → expression (Ausdruck)</text>
<text x="36" y="728" fill="#a7b4c5" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">Diese Zeile liest keinen Dateiinhalt.</text>
</svg>