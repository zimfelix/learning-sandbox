<svg xmlns="http://www.w3.org/2000/svg" width="780" height="604" viewBox="0 0 780 604">
<rect width="100%" height="100%" rx="18" fill="#181c23"/>
<rect width="7" height="100%" rx="3" fill="#cba6f7"/>
<text x="36" y="44" fill="#cba6f7" font-family="sans-serif" font-size="29" font-weight="700" xml:space="preserve">Property</text>
<text x="36" y="80" fill="#a7b4c5" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">Property (Eigenschaft)</text>
<text x="36" y="140" fill="#ffffff" font-family="sans-serif" font-size="21" font-weight="700" xml:space="preserve">Ergebnis lesen, ohne Aufrufklammern.</text>
<text x="36" y="200" fill="#89dceb" font-family="monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve">path.parent</tspan></text>
<text x="36" y="260" fill="#d9e1ec" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">Sieht wie ein Wert aus; kann berechnet werden.</text>
<text x="36" y="320" fill="#a7b4c5" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">Definition innerhalb einer Klasse:</text>
<text x="36" y="356" fill="#89dceb" font-family="monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve">@property</tspan></text>
<text x="36" y="392" fill="#89dceb" font-family="monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve"></tspan><tspan fill="#cba6f7" xml:space="preserve">def</tspan><tspan fill="#89dceb" xml:space="preserve"> remaining_attempts(self):</tspan></text>
<text x="36" y="428" fill="#89dceb" font-family="monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve">    </tspan><tspan fill="#cba6f7" xml:space="preserve">return</tspan><tspan fill="#89dceb" xml:space="preserve"> self.max_attempts - self.used_attempts</tspan></text>
<text x="36" y="488" fill="#89dceb" font-family="monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve">game.remaining_attempts  </tspan><tspan fill="#94a3b8" xml:space="preserve"># Property lesen</tspan><tspan fill="#89dceb" xml:space="preserve"></tspan></text>
<text x="36" y="548" fill="#a7b4c5" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">Ein Setter kann auch Zuweisungen ermöglichen.</text>
</svg>