<svg xmlns="http://www.w3.org/2000/svg" width="780" height="616" viewBox="0 0 780 616">
<rect width="100%" height="100%" rx="18" fill="#181c23"/>
<rect width="7" height="100%" rx="3" fill="#a6e3a1"/>
<text x="36" y="44" fill="#a6e3a1" font-family="sans-serif" font-size="29" font-weight="700" xml:space="preserve">With &amp; Paths</text>
<text x="36" y="80" fill="#a7b4c5" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">Context management (Kontextverwaltung)</text>
<text x="36" y="140" fill="#ffffff" font-family="sans-serif" font-size="21" font-weight="700" xml:space="preserve">Geordnet benutzen und anschließend aufräumen.</text>
<text x="36" y="200" fill="#89dceb" font-family="monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve"></tspan><tspan fill="#cba6f7" xml:space="preserve">with</tspan><tspan fill="#89dceb" xml:space="preserve"> path.open(encoding=</tspan><tspan fill="#a6e3a1" xml:space="preserve">&quot;utf-8&quot;</tspan><tspan fill="#89dceb" xml:space="preserve">) </tspan><tspan fill="#cba6f7" xml:space="preserve">as</tspan><tspan fill="#89dceb" xml:space="preserve"> file:</tspan></text>
<text x="36" y="236" fill="#89dceb" font-family="monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve">    data = json.load(file)</tspan></text>
<text x="36" y="296" fill="#d9e1ec" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">Datei → anschließend schließen.</text>
<text x="36" y="332" fill="#d9e1ec" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">SQLite-Verbindung → Commit oder Rollback.</text>
<text x="36" y="368" fill="#a7b4c5" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">Die Verbindung wird dadurch nicht geschlossen.</text>
<text x="36" y="428" fill="#89dceb" font-family="monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve">path.mkdir()           </tspan><tspan fill="#94a3b8" xml:space="preserve"># Ordner erstellen</tspan><tspan fill="#89dceb" xml:space="preserve"></tspan></text>
<text x="36" y="464" fill="#89dceb" font-family="monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve">path.with_suffix(</tspan><tspan fill="#a6e3a1" xml:space="preserve">&quot;.db&quot;</tspan><tspan fill="#89dceb" xml:space="preserve">)</tspan></text>
<text x="36" y="524" fill="#d9e1ec" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">with_suffix: neues Pfadobjekt mit anderer Endung.</text>
<text x="36" y="560" fill="#a7b4c5" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">Benennt keine Datei auf der Festplatte um.</text>
</svg>