<svg xmlns="http://www.w3.org/2000/svg" width="780" height="616" viewBox="0 0 780 616">
<rect width="100%" height="100%" rx="18" fill="#181c23"/>
<rect width="7" height="100%" rx="3" fill="#a6e3a1"/>
<text x="36" y="44" fill="#a6e3a1" font-family="sans-serif" font-size="29" font-weight="700" xml:space="preserve">Built-ins</text>
<text x="36" y="80" fill="#a7b4c5" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">Functions · Types · Exceptions (eingebaute Elemente)</text>
<text x="36" y="140" fill="#ffffff" font-family="sans-serif" font-size="21" font-weight="700" xml:space="preserve">try versucht; except behandelt die Ausnahme.</text>
<text x="36" y="200" fill="#89dceb" font-family="monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve">isinstance(data, dict)  </tspan><tspan fill="#94a3b8" xml:space="preserve"># Typ prüfen</tspan><tspan fill="#89dceb" xml:space="preserve"></tspan></text>
<text x="36" y="260" fill="#d9e1ec" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">Types (Typen): dict, int, str, tuple …</text>
<text x="36" y="296" fill="#d9e1ec" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">Exceptions (Ausnahmen): ValueError, TypeError …</text>
<text x="36" y="356" fill="#89dceb" font-family="monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve"></tspan><tspan fill="#cba6f7" xml:space="preserve">try</tspan><tspan fill="#89dceb" xml:space="preserve">:</tspan></text>
<text x="36" y="392" fill="#89dceb" font-family="monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve">    </tspan><tspan fill="#cba6f7" xml:space="preserve">with</tspan><tspan fill="#89dceb" xml:space="preserve"> path.open() </tspan><tspan fill="#cba6f7" xml:space="preserve">as</tspan><tspan fill="#89dceb" xml:space="preserve"> file:</tspan></text>
<text x="36" y="428" fill="#89dceb" font-family="monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve">        text = file.read()</tspan></text>
<text x="36" y="464" fill="#89dceb" font-family="monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve"></tspan><tspan fill="#cba6f7" xml:space="preserve">except</tspan><tspan fill="#89dceb" xml:space="preserve"> FileNotFoundError:</tspan></text>
<text x="36" y="500" fill="#89dceb" font-family="monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve">    print(</tspan><tspan fill="#a6e3a1" xml:space="preserve">&quot;Datei fehlt.&quot;</tspan><tspan fill="#89dceb" xml:space="preserve">)</tspan></text>
<text x="36" y="560" fill="#a7b4c5" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">isinstance berücksichtigt auch Unterklassen.</text>
</svg>