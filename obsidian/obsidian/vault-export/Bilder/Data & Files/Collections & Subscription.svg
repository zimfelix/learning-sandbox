<svg xmlns="http://www.w3.org/2000/svg" width="780" height="628" viewBox="0 0 780 628">
<rect width="100%" height="100%" rx="18" fill="#181c23"/>
<rect width="7" height="100%" rx="3" fill="#a6e3a1"/>
<text x="36" y="44" fill="#a6e3a1" font-family="sans-serif" font-size="29" font-weight="700" xml:space="preserve">Collections &amp; Subscription</text>
<text x="36" y="80" fill="#a7b4c5" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">Collections (Sammlungen) · Subscription (Indexzugriff)</text>
<text x="36" y="140" fill="#ffffff" font-family="sans-serif" font-size="21" font-weight="700" xml:space="preserve">. greift auf Attribute zu; [] auf Einträge.</text>
<text x="36" y="200" fill="#89dceb" font-family="monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve">[</tspan><tspan fill="#a6e3a1" xml:space="preserve">&quot;a&quot;</tspan><tspan fill="#89dceb" xml:space="preserve">, </tspan><tspan fill="#a6e3a1" xml:space="preserve">&quot;b&quot;</tspan><tspan fill="#89dceb" xml:space="preserve">]             </tspan><tspan fill="#94a3b8" xml:space="preserve"># list (Liste)</tspan><tspan fill="#89dceb" xml:space="preserve"></tspan></text>
<text x="36" y="236" fill="#89dceb" font-family="monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve">(</tspan><tspan fill="#a6e3a1" xml:space="preserve">&quot;a&quot;</tspan><tspan fill="#89dceb" xml:space="preserve">, </tspan><tspan fill="#a6e3a1" xml:space="preserve">&quot;b&quot;</tspan><tspan fill="#89dceb" xml:space="preserve">)             </tspan><tspan fill="#94a3b8" xml:space="preserve"># tuple (Tupel)</tspan><tspan fill="#89dceb" xml:space="preserve"></tspan></text>
<text x="36" y="272" fill="#89dceb" font-family="monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve">{</tspan><tspan fill="#a6e3a1" xml:space="preserve">&quot;provider&quot;</tspan><tspan fill="#89dceb" xml:space="preserve">: </tspan><tspan fill="#a6e3a1" xml:space="preserve">&quot;claude&quot;</tspan><tspan fill="#89dceb" xml:space="preserve">} </tspan><tspan fill="#94a3b8" xml:space="preserve"># dict (Dictionary)</tspan><tspan fill="#89dceb" xml:space="preserve"></tspan></text>
<text x="36" y="308" fill="#89dceb" font-family="monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve">{</tspan><tspan fill="#a6e3a1" xml:space="preserve">&quot;a&quot;</tspan><tspan fill="#89dceb" xml:space="preserve">, </tspan><tspan fill="#a6e3a1" xml:space="preserve">&quot;b&quot;</tspan><tspan fill="#89dceb" xml:space="preserve">}             </tspan><tspan fill="#94a3b8" xml:space="preserve"># set (Menge)</tspan><tspan fill="#89dceb" xml:space="preserve"></tspan></text>
<text x="36" y="368" fill="#d9e1ec" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">List: geordnet und veränderbar.</text>
<text x="36" y="404" fill="#d9e1ec" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">Tuple: geordnet; Einträge nicht ersetzbar.</text>
<text x="36" y="440" fill="#d9e1ec" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">Dict: Schlüssel führen zu Werten.</text>
<text x="36" y="476" fill="#d9e1ec" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">Set: keine Duplikate; keine feste Reihenfolge.</text>
<text x="36" y="536" fill="#89dceb" font-family="monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve">measurement[</tspan><tspan fill="#a6e3a1" xml:space="preserve">&quot;provider&quot;</tspan><tspan fill="#89dceb" xml:space="preserve">]  </tspan><tspan fill="#94a3b8" xml:space="preserve"># Eintrag holen</tspan><tspan fill="#89dceb" xml:space="preserve"></tspan></text>
<text x="36" y="572" fill="#a7b4c5" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">Tupel können veränderbare Objekte enthalten.</text>
</svg>