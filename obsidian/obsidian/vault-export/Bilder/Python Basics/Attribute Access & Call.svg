<svg xmlns="http://www.w3.org/2000/svg" width="780" height="652" viewBox="0 0 780 652">
<rect width="100%" height="100%" rx="18" fill="#181c23"/>
<rect x="0" y="0" width="7" height="100%" rx="3" fill="#f6c85f"/>
<text x="36" y="44" fill="#f6c85f" font-family="sans-serif" font-size="29" font-weight="700">Attribute Access &amp; Call</text>
<text x="36" y="80" fill="#a7b4c5" font-family="sans-serif" font-size="21" font-weight="400">Attribute access (Attributzugriff) · Call (Aufruf)</text>
<text x="36" y="140" fill="#ffffff" font-family="sans-serif" font-size="21" font-weight="700">Der Punkt greift zu; nachgestellte () rufen auf.</text>
<text x="36" y="200" font-family="monospace" font-size="19" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve"></tspan><tspan fill="#cba6f7" xml:space="preserve">from</tspan><tspan fill="#89dceb" xml:space="preserve"> pathlib </tspan><tspan fill="#cba6f7" xml:space="preserve">import</tspan><tspan fill="#89dceb" xml:space="preserve"> Path</tspan></text>
<text x="36" y="236" font-family="monospace" font-size="19" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve">path = Path(</tspan><tspan fill="#a6e3a1" xml:space="preserve">&quot;data/usage.json&quot;</tspan><tspan fill="#89dceb" xml:space="preserve">)</tspan></text>
<text x="36" y="296" font-family="monospace" font-size="19" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve">path.parent       </tspan><tspan fill="#94a3b8" xml:space="preserve"># Property lesen</tspan><tspan fill="#89dceb" xml:space="preserve"></tspan></text>
<text x="36" y="332" font-family="monospace" font-size="19" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve">path.resolve      </tspan><tspan fill="#94a3b8" xml:space="preserve"># Methode abrufen</tspan><tspan fill="#89dceb" xml:space="preserve"></tspan></text>
<text x="36" y="368" font-family="monospace" font-size="19" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve">path.resolve()    </tspan><tspan fill="#94a3b8" xml:space="preserve"># Methode aufrufen</tspan><tspan fill="#89dceb" xml:space="preserve"></tspan></text>
<text x="36" y="428" fill="#d9e1ec" font-family="sans-serif" font-size="21" font-weight="400">Attribute: erreichbar über den Punkt.</text>
<text x="36" y="464" fill="#d9e1ec" font-family="sans-serif" font-size="21" font-weight="400">Eine Methode ist ebenfalls ein Attribut.</text>
<text x="36" y="524" font-family="monospace" font-size="19" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve">print(</tspan><tspan fill="#a6e3a1" xml:space="preserve">&quot;Hallo&quot;</tspan><tspan fill="#89dceb" xml:space="preserve">)    </tspan><tspan fill="#94a3b8" xml:space="preserve"># function call</tspan><tspan fill="#89dceb" xml:space="preserve"></tspan></text>
<text x="36" y="560" font-family="monospace" font-size="19" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve">text = </tspan><tspan fill="#a6e3a1" xml:space="preserve">&quot;claude&quot;</tspan><tspan fill="#89dceb" xml:space="preserve"></tspan></text>
<text x="36" y="596" font-family="monospace" font-size="19" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve">text.upper()      </tspan><tspan fill="#94a3b8" xml:space="preserve"># method call</tspan><tspan fill="#89dceb" xml:space="preserve"></tspan></text>
</svg>