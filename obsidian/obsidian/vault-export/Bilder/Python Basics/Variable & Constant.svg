<svg xmlns="http://www.w3.org/2000/svg" width="780" height="580" viewBox="0 0 780 580">
<rect width="100%" height="100%" rx="18" fill="#181c23"/>
<rect x="0" y="0" width="7" height="100%" rx="3" fill="#f6c85f"/>
<text x="36" y="44" fill="#f6c85f" font-family="sans-serif" font-size="29" font-weight="700">Variable &amp; Constant</text>
<text x="36" y="80" fill="#a7b4c5" font-family="sans-serif" font-size="21" font-weight="400">Variable (Variable) · Constant (Konstante)</text>
<text x="36" y="140" fill="#ffffff" font-family="sans-serif" font-size="21" font-weight="700">= bindet einen Namen an ein Ergebnis.</text>
<text x="36" y="200" font-family="monospace" font-size="19" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve">provider = </tspan><tspan fill="#a6e3a1" xml:space="preserve">&quot;claude&quot;</tspan><tspan fill="#89dceb" xml:space="preserve"></tspan></text>
<text x="36" y="260" fill="#d9e1ec" font-family="sans-serif" font-size="21" font-weight="400">provider → variable name (Variablenname)</text>
<text x="36" y="296" fill="#d9e1ec" font-family="sans-serif" font-size="21" font-weight="400">&quot;claude&quot; → value (Wert)</text>
<text x="36" y="332" fill="#d9e1ec" font-family="sans-serif" font-size="21" font-weight="400">= → assignment (Zuweisung)</text>
<text x="36" y="392" font-family="monospace" font-size="19" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve">MAX_ATTEMPTS = </tspan><tspan fill="#f6c85f" xml:space="preserve">5</tspan><tspan fill="#89dceb" xml:space="preserve"></tspan></text>
<text x="36" y="452" fill="#d9e1ec" font-family="sans-serif" font-size="21" font-weight="400">Constant: soll nicht neu zugewiesen werden.</text>
<text x="36" y="488" fill="#d9e1ec" font-family="sans-serif" font-size="21" font-weight="400">Großschreibung ist eine Konvention.</text>
<text x="36" y="524" fill="#a7b4c5" font-family="sans-serif" font-size="21" font-weight="400">Python erzwingt diese Regel nicht.</text>
</svg>