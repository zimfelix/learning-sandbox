<svg xmlns="http://www.w3.org/2000/svg" width="780" height="688" viewBox="0 0 780 688">
<rect width="100%" height="100%" rx="18" fill="#181c23"/>
<rect width="7" height="100%" rx="3" fill="#cba6f7"/>
<text x="36" y="44" fill="#cba6f7" font-family="sans-serif" font-size="29" font-weight="700" xml:space="preserve">Method Types</text>
<text x="36" y="80" fill="#a7b4c5" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">Instance · Class · Static method</text>
<text x="36" y="140" fill="#ffffff" font-family="sans-serif" font-size="21" font-weight="700" xml:space="preserve">self = dieses Objekt · cls = diese Klasse</text>
<text x="36" y="176" fill="#d9e1ec" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">Static = zugehörige Hilfsfunktion.</text>
<text x="36" y="236" fill="#a7b4c5" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">Definitionen innerhalb einer Klasse:</text>
<text x="36" y="272" fill="#89dceb" font-family="monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve"></tspan><tspan fill="#cba6f7" xml:space="preserve">def</tspan><tspan fill="#89dceb" xml:space="preserve"> reset(self):</tspan></text>
<text x="36" y="308" fill="#89dceb" font-family="monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve">    ...</tspan></text>
<text x="36" y="368" fill="#89dceb" font-family="monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve">@classmethod</tspan></text>
<text x="36" y="404" fill="#89dceb" font-family="monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve"></tspan><tspan fill="#cba6f7" xml:space="preserve">def</tspan><tspan fill="#89dceb" xml:space="preserve"> from_random_word(cls):</tspan></text>
<text x="36" y="440" fill="#89dceb" font-family="monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve">    ...</tspan></text>
<text x="36" y="500" fill="#89dceb" font-family="monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve">@staticmethod</tspan></text>
<text x="36" y="536" fill="#89dceb" font-family="monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve"></tspan><tspan fill="#cba6f7" xml:space="preserve">def</tspan><tspan fill="#89dceb" xml:space="preserve"> is_valid_letter(letter):</tspan></text>
<text x="36" y="572" fill="#89dceb" font-family="monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve">    </tspan><tspan fill="#cba6f7" xml:space="preserve">return</tspan><tspan fill="#89dceb" xml:space="preserve"> len(letter) == 1</tspan></text>
<text x="36" y="632" fill="#a7b4c5" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">Static erhält weder self noch cls automatisch.</text>
</svg>