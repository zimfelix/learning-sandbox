<svg xmlns="http://www.w3.org/2000/svg" width="780" height="640" viewBox="0 0 780 640">
<rect width="100%" height="100%" rx="18" fill="#181c23"/>
<rect width="7" height="100%" rx="3" fill="#cba6f7"/>
<text x="36" y="44" fill="#cba6f7" font-family="sans-serif" font-size="29" font-weight="700" xml:space="preserve">Dataclass &amp; Inheritance</text>
<text x="36" y="80" fill="#a7b4c5" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">Dataclass (Datenklasse) · Inheritance (Vererbung)</text>
<text x="36" y="140" fill="#ffffff" font-family="sans-serif" font-size="21" font-weight="700" xml:space="preserve">Daten zusammenhalten, Schreibarbeit sparen.</text>
<text x="36" y="200" fill="#89dceb" font-family="monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve"></tspan><tspan fill="#cba6f7" xml:space="preserve">from</tspan><tspan fill="#89dceb" xml:space="preserve"> dataclasses </tspan><tspan fill="#cba6f7" xml:space="preserve">import</tspan><tspan fill="#89dceb" xml:space="preserve"> dataclass</tspan></text>
<text x="36" y="260" fill="#89dceb" font-family="monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve">@dataclass</tspan></text>
<text x="36" y="296" fill="#89dceb" font-family="monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve"></tspan><tspan fill="#cba6f7" xml:space="preserve">class</tspan><tspan fill="#89dceb" xml:space="preserve"> Measurement:</tspan></text>
<text x="36" y="332" fill="#89dceb" font-family="monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve">    provider: str</tspan></text>
<text x="36" y="368" fill="#89dceb" font-family="monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve">    amount: float</tspan></text>
<text x="36" y="428" fill="#d9e1ec" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">Erzeugt u. a. __init__, __repr__ und __eq__.</text>
<text x="36" y="488" fill="#89dceb" font-family="monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve"></tspan><tspan fill="#cba6f7" xml:space="preserve">class</tspan><tspan fill="#89dceb" xml:space="preserve"> Hangman(Game):</tspan></text>
<text x="36" y="524" fill="#89dceb" font-family="monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve">    </tspan><tspan fill="#cba6f7" xml:space="preserve">pass</tspan><tspan fill="#89dceb" xml:space="preserve"></tspan></text>
<text x="36" y="584" fill="#d9e1ec" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">Hangman erbt von der Basisklasse Game.</text>
</svg>