<svg xmlns="http://www.w3.org/2000/svg" width="780" height="520" viewBox="0 0 780 520">
<rect width="100%" height="100%" rx="18" fill="#181c23"/>
<rect width="7" height="100%" rx="3" fill="#cba6f7"/>
<text x="36" y="44" fill="#cba6f7" font-family="sans-serif" font-size="29" font-weight="700" xml:space="preserve">Class &amp; Object</text>
<text x="36" y="80" fill="#a7b4c5" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">Class (Klasse) · Object (Objekt)</text>
<text x="36" y="140" fill="#ffffff" font-family="sans-serif" font-size="21" font-weight="700" xml:space="preserve">Klasse = Bauplan; Objekt = konkretes Exemplar.</text>
<text x="36" y="200" fill="#89dceb" font-family="monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve"></tspan><tspan fill="#cba6f7" xml:space="preserve">from</tspan><tspan fill="#89dceb" xml:space="preserve"> pathlib </tspan><tspan fill="#cba6f7" xml:space="preserve">import</tspan><tspan fill="#89dceb" xml:space="preserve"> Path</tspan></text>
<text x="36" y="236" fill="#89dceb" font-family="monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#89dceb" xml:space="preserve">path = Path(</tspan><tspan fill="#a6e3a1" xml:space="preserve">&quot;data/usage.json&quot;</tspan><tspan fill="#89dceb" xml:space="preserve">)</tspan></text>
<text x="36" y="296" fill="#d9e1ec" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">Path → class (Klasse)</text>
<text x="36" y="332" fill="#d9e1ec" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">Path(...) → erzeugt ein object (Objekt)</text>
<text x="36" y="368" fill="#d9e1ec" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">path → Name für dieses Objekt</text>
<text x="36" y="428" fill="#d9e1ec" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">Instance (Instanz): konkretes Objekt einer Klasse.</text>
<text x="36" y="464" fill="#a7b4c5" font-family="sans-serif" font-size="21" font-weight="400" xml:space="preserve">Das Bauplan-Bild ist eine Einstiegsvereinfachung.</text>
</svg>