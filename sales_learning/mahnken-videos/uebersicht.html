<style>

.oth{margin-top:4px;font-size:12px;color:var(--mut)}.oth b{color:var(--fg);font-weight:600}
a{color:var(--fg);text-decoration:none}a:hover{color:var(--acc)}.mut{color:var(--mut)}.tag{font-size:12px;color:var(--mut)}
.wa .y{background:var(--w);border-radius:6px;padding:3px 7px;display:block}.wa .y b{color:var(--acc)}

details summary{cursor:pointer;color:var(--mut)}details ul{margin:6px 0 0;padding-left:18px}details li{margin:4px 0}
h2{font-size:16px;margin:22px 0 6px}h3{font-size:13px;color:var(--mut);margin:14px 0 4px;text-transform:uppercase;letter-spacing:.03em}
.it{padding:6px 0;border-bottom:1px solid var(--line)}.it .src{font-size:12px;color:var(--mut)}
tr.rg td{background:var(--rgb)}tr.rg td:first-child{box-shadow:inset 4px 0 var(--rg)}
tr.ry td{background:var(--ryb)}tr.ry td:first-child{box-shadow:inset 4px 0 var(--ry)}
tr.rd td{background:var(--rdb)}tr.rw td{background:var(--rwb)}tr.rw td:first-child{box-shadow:inset 4px 0 var(--rw)}
tr.rl td{background:var(--rrb)}tr.rl td:first-child{box-shadow:inset 4px 0 var(--rr)}.lv{font-size:12px;font-weight:600;color:var(--rr)}
tr.rrot td:not(.me){opacity:.5}tr.rrot td:first-child{box-shadow:inset 4px 0 var(--mut)}
tr.rx td:not(.me){opacity:.5}td.dt{color:var(--mut);white-space:nowrap;font-size:12px;width:1%;font-variant-numeric:tabular-nums}
.gem{font-size:12px;font-weight:600;color:var(--acc)}.why{font-size:12px;color:var(--mut)}
.leg{font-size:12px;color:var(--mut);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.mode{font-size:12px;color:var(--mut)}.mode.err{color:var(--rr)}
.thm{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}.thm button{padding:3px 8px;font-size:12px}.thm .seen{margin:0 0 0 6px}.lf{max-width:860px;font-size:15px;line-height:1.55}.lf h1{font-size:22px;margin:8px 0}.lf h2{font-size:19px;margin:28px 0 6px;padding-top:12px;border-top:1px solid var(--line)}.lf h3{font-size:15px;margin:16px 0 4px;color:var(--mut)}.lf p{margin:4px 0}.lf p.b{margin-left:18px;text-indent:-12px}.lf p.b::before{content:"• "}
.kh{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
/* Leitfaden: gesprochene Sätze (grün) und Details, je Überschrift ein farbiger Block */
.say{border-left:3px solid var(--t);background:var(--rgb);padding:6px 12px;margin:8px 0;border-radius:0 6px 6px 0}.say .kh{color:var(--t)}
.kd{margin:10px 0 6px;font-size:14px}

.ks.kp{--c:var(--fg)}.ks.mini{--c:var(--ry);--cb:var(--ryb)}.ks.ton{--c:var(--a);--cb:var(--ab)}.ks.alt{--c:var(--rw);--cb:var(--rwb)}
.lf p.dl{margin:4px 0 8px}.lf p.dl a{display:inline-block;padding:6px 12px;border:2px solid var(--acc);border-radius:8px;color:var(--acc);font-weight:600}
.lf p.no{background:var(--rrb);border-radius:4px;padding:2px 6px;margin-left:0;text-indent:0}.lf p.no::before{content:none}
.ib{border:0;background:none;padding:0 3px;font-size:12px;color:var(--mut);opacity:.75}.ib:hover{opacity:1}li.dl{opacity:.5}li.dl .tx{text-decoration:line-through}.edf{margin:4px 0}.edf textarea{width:100%;min-height:60px}.edf>*{margin-right:4px}.edf select,.edf input{padding:3px 6px}
.it.du{opacity:.55}details.uu{margin:6px 0 0 4px;opacity:.6}details.uu summary{font-size:12px}.uk{white-space:nowrap}.uk input{vertical-align:-2px}
.fd{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}.fd .pc{min-width:0;border:1px solid var(--line);border-radius:8px;padding:4px 6px}.fd .pc.own{border-color:var(--acc)}
.fd .pn{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--mut)}.fd .pc.own .pn{color:var(--acc)}.fd .pk{font-size:12px;padding:3px 6px;border-width:1px}.fd .pk:has(input:disabled){cursor:default}.fd select{width:100%;padding:3px 4px;font-size:12px;margin-bottom:3px}.fd .pk.ro{font-weight:400;color:var(--mut);margin:0 0 3px}
#ich{margin-left:auto;border:2px solid var(--acc);color:var(--acc);font-weight:600}
.pk{display:flex;gap:7px;align-items:center;margin-top:5px;padding:5px 8px;border:2px solid var(--line);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}.pk input{width:17px;height:17px;margin:0;flex:none}
.pw:has(input:checked){border-color:var(--rg);background:var(--rgb);color:var(--rg)}.pa:has(input:checked){border-color:var(--rw);background:var(--rwb);color:var(--rw)}.pg:has(input:checked){border-color:var(--acc);background:var(--w);color:var(--acc)}
.fg{display:grid;grid-template-columns:minmax(150px,.8fr) minmax(190px,1fr) minmax(250px,1.3fr) minmax(230px,1.2fr);gap:10px;width:100%;align-items:stretch}
.fc{display:flex;flex-direction:column;gap:3px;background:var(--head);border:1px solid var(--line);border-radius:8px;padding:8px}
.fh{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);padding:0 4px 4px}
.thm .fb{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:4px 8px;font-size:13px;line-height:1.3;text-align:left;border:1px solid transparent;background:transparent;border-radius:5px}
.thm .fb:hover{background:var(--chip)}.thm .fb.on{background:var(--w);border-color:var(--acc);color:var(--acc);font-weight:600}
.thm .fb.fa{font-weight:600;border-bottom:1px solid var(--line);border-radius:5px 5px 0 0;margin-bottom:2px}
.fn{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}.fb.on .fn{color:var(--acc)}
.fx{display:flex;gap:10px;align-items:center;flex-wrap:wrap;width:100%;margin-top:8px}
@media(max-width:800px){.fg{grid-template-columns:1fr 1fr}}
.thm .sep{width:1px;height:18px;background:var(--line);margin:0 4px}

<div class=top>
 <div class=stats id=stats></div>
 <div class=bar>
  <button id=v1 class=on>Videos</button><button id=v2>Sammlung</button><button id=v3>📋 Leitfaden</button>
  <input id=q placeholder="Suchen in Titel, Zielgruppe, Learnings, Kommentaren …">
  <select id=f aria-label="Status"><option value="">Alle Bewertungen</option><option value=d>✓ ausgewertet, lehrreich</option><option value=x>⚪ nicht relevant</option><option value=l>🔴 live wiederholen</option><option value=rot>⛔ gesehen, unbrauchbar</option><option value=g>🟢 noch auswerten</option><option value=y>🟡 vielleicht</option><option value=open>☐ noch nicht ausgewertet</option></select>
  <select id=ph aria-label="Phase"><option value="">Alle Phasen</option><option value=K>Kaltakquise</option><option value=T>Termin / Verkaufsgespräch</option><option value=A>Andere Verkaufsform</option></select>
  <button id=cp>⭐ Auswahl kopieren</button>

 </div>

<script src="videos.js"></script><script src="notes.js"></script><script src="dates.js"></script><script src="auswahl.js"></script><script src="leitfaden.js"></script><script src="kern.js"></script>
<script>
const D=window.VIDEOS,N=window.NOTES||{},DT=window.DATES||{},AW=window.AUSWAHL||{},$=id=>document.getElementById(id);
const LOCAL=location.protocol=='file:';
/* Leitfaden: Quelle ist sales_learning/leitfaden.docx, exportiert per leitfaden_export.py; dort verlinkte Videos sind 📌 */
/* Details je Abschnitt aus kern.js; Videos aus Leitfaden und Details sind 📌 */
const KR=window.KERN||{},LFH=window.LEITFADEN||'',LF=new Set([...(LFH+Object.values(KR).map(k=>k.html).join('')).matchAll(/youtu\.be\/([\w-]{11})/g)].map(m=>m[1]));
const fdt=s=>s?s.slice(8,10)+'.'+s.slice(5,7)+'.'+s.slice(0,4):'';
const since=m=>{const d=new Date();d.setMonth(d.getMonth()-m);return d.toISOString().slice(0,10)};
const PH={K:'Kaltakquise',T:'Termin / Verkaufsgespräch',A:'Andere Verkaufsform'};
const TY0=['Sekretärin','Opener','Bedarfsfrage','Rückfrage','Einwand','Terminvereinbarung','Gesprächseinstieg','Präsentation','Preis','Abschluss','Verkaufsgespräch','Nachfassen','Leitfaden','Prinzip','Organisation'];
const TY=[...TY0,...new Set(Object.values(N).flatMap(n=>(n.items||[]).map(i=>i.y)).filter(y=>!TY0.includes(y)))];
/* Auswahl je Video: blau = Anhör-Liste; rot (l) = starkes Live-Telefonat, ein zweites Mal ansehen (Betonung, Tonfall, Timing); 🟡/⚪ nehmen ein Video aus der Liste.
   g/rot nur noch sichtbar, wo schon gesetzt; rot = altes „gesehen, unbrauchbar“ (grau, ⛔) – Schlüssel bleibt, damit gespeicherte Werte ihre Bedeutung behalten */
const RV=[['','Vorschlag übernehmen'],['w','🔵 anhören (blaue Liste)'],['l','🔴 live wiederholen'],['y','🟡 raus: vielleicht'],['x','⚪ raus: wertlos'],['g','🟢 relevant',1],['rot','⛔ gesehen, unbrauchbar',1]];
let S={},view='videos';try{S=JSON.parse(localStorage.getItem('s')||'{}');view=localStorage.getItem('v')||'videos'}catch(e){}
const save=()=>{try{localStorage.setItem('s',JSON.stringify(S));localStorage.setItem('v',view)}catch(e){}};
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const sec=t=>{const[a,b]=String(t||'0:0').split(':').map(Number);return a*60+(b||0)};
const link=(id,t)=>`https://youtu.be/${id}${t?'?t='+sec(t):''}`;
const items=(id,ph)=>{return(N[id]?.items||[]).filter(i=>!ph||i.p==ph)};
/* Umgesetzt = im Leitfaden verarbeitet: Feld u in notes.js (Agent) oder Häkchen in der Sammlung (je Person, mine.u) */
const isU=(id,k)=>!!N[id]?.items?.[k]?.u||WHO.some(w=>(colOf(w)?.[id]?.u||[]).includes(k));
const done=d=>{const I=N[d.id]?.items||[];return I.length>0&&I.every((_,k)=>isU(d.id,k))};
/* Video-IDs in Learning-Texten als „Nr. X“ zeigen */
const NR=Object.fromEntries(D.map(d=>[d.id,d.n])),nx=t=>esc(t).replace(/[\w-]{11}/g,m=>NR[m]?'Nr.&nbsp;'+NR[m]:m);
/* Bearbeiten-Overlay: mine[id].ed = {"<index>":{x}|{del:true}}, mine[id].add = [{p,y,t,x}]; Originale in notes.js bleiben unberührt. Zustand: offene <details>, Bearbeitung, Entwürfe */
let OPEN=new Set(),EDK=null,DR=null,ADD=null,AF={};
const ME=()=>ST.who,srcs=()=>[...WHO.filter(w=>w!=ST.who).map(w=>[w,colOf(w)||{}]),[ST.who,ST.mine]];
const who=u=>u==ME()?'':' · '+PN[u];
/* Wirksame Änderung je Learning: alle Personen, eigene zuletzt */
const ovr=(id,k)=>{let o=null;for(const[u,v]of srcs()){const e=v[id]?.ed?.[k];if(e)o={...e,u}}return o};
const adds=id=>srcs().flatMap(([u,v])=>(v[id]?.add||[]).map((a,j)=>({...a,u,j})));
const lis=(id,ph)=>{const L=(N[id]?.items||[]).map((o,k)=>{const ov=ovr(id,k);return{i:ov?.x!=null?{...o,x:ov.x}:o,k,ov}});adds(id).forEach(a=>L.push({i:a,k:-1,a}));return L.filter(e=>!ph||e.i.p==ph)};
const chg=e=>e.a?`<span class=chip>➕ neu${who(e.a.u)}</span>`:e.ov?.del?`<span class=chip>🗑 gelöscht${who(e.ov.u)}</span>`:e.ov?.x!=null?`<span class=chip>✏️ geändert${who(e.ov.u)}</span>`:'';
const li=(id,e)=>{const{i,k,ov,a}=e,key=id+'|'+k,dl=!!ov?.del,own=(ov?.u??a?.u)==ME(),o=ST.mine[id]?.ed?.[k];
 const bt=a?(own?`<button class=ib data-deladd="${id}|${a.j}" title="entfernen">🗑</button>`:''):dl?(own?`<button class=ib data-undo="${key}">↩ wiederherstellen</button>`:''):`<button class=ib data-ed="${key}" title="bearbeiten">✏️</button><button class=ib data-del="${key}" title="löschen">🗑</button>`;
 const f=!a&&EDK==key?`<div class=edf><textarea data-edt=1 rows=3>${esc(DR??i.x)}</textarea><button data-save="${key}">Speichern</button><button data-cancel>Abbrechen</button>${o?`<button data-orig="${key}">↩ Original</button>`:''}</div>`:'';
 return `<li${dl?' class=dl':''}><span class="chip ph ${i.p}">${i.p}</span><span class=chip>${esc(i.y)}${i.e?': '+esc(i.e):''}</span>${chg(e)}<span class=tx>${nx(i.x)}</span>${i.s?' <i class=mut>(sinngemäß)</i>':''} <a href="${link(id,i.t)}" target=_blank>▶${i.t?'&nbsp;'+esc(i.t):''}</a> ${bt}${f}</li>`};
/* Formular „Learning hinzufügen“ */
const addf=id=>{const g=AF,sel=(n,L,v)=>`<select data-af=${n}>${L.map(([val,lab])=>`<option value="${esc(val)}"${val==v?' selected':''}>${esc(lab)}</option>`).join('')}</select>`;
 return `<div class=edf>${sel('p',Object.keys(PH).map(k=>[k,k+' '+PH[k]]),g.p||'K')} ${sel('y',TY0.map(y=>[y,y]),g.y||'Prinzip')} <input data-af=t placeholder="m:ss" size=6 value="${esc(g.t||'')}"><br><textarea data-af=x rows=3 placeholder="Learning-Text">${esc(g.x||'')}</textarea><br><button data-addsave="${id}">Speichern</button><button data-cancel>Abbrechen</button></div>`};

/* Bewertungen je Person: F = Felix, D = Demi – Auswahl oben rechts, kein Login (nur Zuordnung).
   Online: Dokument notizen/F bzw. notizen/D = {videos:{<id>:{r,seen,again,text,k,u,ed,add}}}; lokal: localStorage bew_F / bew_D.
   mine = Notizen der gewählten Person (editierbar), all = beide Personen (online). Jeder sieht die Spalte des anderen. */
const WHO=['F','D'],PN={F:'Felix',D:'Demi'};
let ICH='';try{ICH=localStorage.getItem('ich')||''}catch(e){}
const ST={mine:{},all:{},kern:{},who:WHO.includes(ICH)?ICH:'F',db:null,online:false,inflight:0,deferred:false};
/* Kern-Video je Person: Feld k ('y'/'n') > Vorschlag aus auswahl.js. Filter und 💎-Abzeichen nutzen die gewählte Person */
/* 💎 Kern-Video gilt für beide: Collection kern (Dokument je Video, Feld g) > Vorschlag aus auswahl.js */
const isKern=id=>{const k=ST.kern[id];return k?!!k.g:!!AW[id]?.gem};
const gemOf=id=>isKern(id)?(AW[id]?.gem||'Kern-Video'):'';
const colOf=w=>w==ST.who?ST.mine:ST.online?(ST.all[w]||null):lsGet(w);
/* Wirksame Farbe: Relevanz der gewählten Person (Feld r) > ausgewertet (Anhör-Liste oder erledigt) > Vorschlag aus auswahl.js */
const eff=id=>(N[id]?(N[id].watch||gemOf(id)?'w':AW[id]?.r=='x'?'x':'d'):AW[id]?.r||'');
const cmText=id=>WHO.map(w=>colOf(w)?.[id]?.text||'').join(' ');
/* lokal je Person ein Eintrag; das alte gemeinsame 'bew' (vor der Trennung, alles von Felix) gilt als F */
function lsGet(w){try{const s=localStorage.getItem('bew_'+w);if(s)return JSON.parse(s);if(w!='F')return{};
 const o=JSON.parse(localStorage.getItem('bew')||'{}'),m=o.mine||{};
 for(const[id,k]of Object.entries(o.kern||{}))if(!m[id]?.k)m[id]={...m[id],k:k.g?'y':'n'};
 for(const[id,v]of Object.entries(o.ov||{}))m[id]={...m[id],r:v.r};return m}catch(e){return{}}}
function lsLoad(){ST.mine=lsGet(ST.who);try{ST.kern=JSON.parse(localStorage.getItem('kern2')||'null')||Object.fromEntries(Object.entries(lsGet('F')).filter(([,v])=>v.k).map(([id,v])=>[id,{g:v.k=='y'}]))}catch(e){}}
function lsSave(){try{localStorage.setItem('bew_'+ST.who,JSON.stringify(ST.mine))}catch(e){}}
function mode(t,err){const m=$('mode');m.textContent=t;m.classList.toggle('err',!!err)}
function queue(fn){ST.inflight++;ST.chain=(ST.chain||Promise.resolve()).then(fn).catch(e=>mode(e?.code=='invalid_argument'?'Keine Schreibrechte – Zugriff als Mitwirkender oder Bearbeiter nötig':'Speichern fehlgeschlagen ('+(e?.code||'Fehler')+')',true)).finally(()=>ST.inflight--)}
function setOv(id,r){setMine(id,{r:r||undefined})}
function setKern(id,on){const def=!!AW[id]?.gem;if(on===def)delete ST.kern[id];else ST.kern[id]={g:on};
 if(!ST.online){try{localStorage.setItem('kern2',JSON.stringify(ST.kern))}catch(e){};return}
